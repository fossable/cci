[package]
name = "cibox"
version = "0.0.1"
edition = "2021"
authors = ["cilki"]
description = "Control your CI/CD"
license = "Unlicense"
repository = "https://github.com/fossable/cibox"
keywords = ["ci", "github-actions", "gitlab-ci", "automation"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
cibox-macros = { path = "../cibox-macros" }
clap = { version = "4.5", features = ["derive", "cargo"] }
derive_builder = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ron = "0.12"
strum = { version = "0.27", features = ["derive"] }
roniker = { git = "https://github.com/fossable/roniker", features = ["lsp"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
toml = "0.9.8"
anyhow = "1.0"
walkdir = "2.5"
cargo_toml = "0.22.3"
colored = "3.0.0"
indicatif = "0.18.3"
similar = "2.4"
console = "0.16.1"
chrono = "0.4"
ratatui = "0.29.0"
crossterm = "0.29.0"

[build-dependencies]
roniker = { git = "https://github.com/fossable/roniker", features = ["analyze"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
